# Gate for luminix/sheets. Model: /arandu references/ci-cd.md + ci-cd-laravel.md.
#
# `checks` is the whole pipeline here, and it gates rather than deploys: a
# package is consumed by Composer version constraint, so there is nothing to
# build, tag or ship. `dusk` is n/a — no UI. No MySQL service either: the suite
# runs on sqlite in memory (phpunit.xml).
#
# The PHP matrix is the point. `openspout/openspout` resolves to v4 on 8.2 and
# to v5 on 8.3+, and the two majors disagree on `Row::__construct` and on the
# fluent style setters. Both legs must stay green or the declared
# `^4.28|^5.3` constraint is a lie. See CLAUDE.md § Workflow.
name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'   # openspout v4
            coverage: none
          - php: '8.3'   # openspout v5
            coverage: none
          - php: '8.4'   # openspout v5, and where the coverage figure comes from
            coverage: pcov
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, pdo_sqlite, sqlite3
          coverage: ${{ matrix.coverage }}
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      # composer.lock is gitignored (library), so the key hashes the constraints.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - run: composer update --prefer-dist --no-progress --no-interaction
      # Cheapest first: a formatting error fails in seconds.
      - run: vendor/bin/pint --test
      - run: composer test
      - if: matrix.coverage == 'pcov'
        run: composer test:coverage
